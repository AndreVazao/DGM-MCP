name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . ruff pytest build
    - name: Run Ruff on changed Python files
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- '*.py' > "${RUNNER_TEMP}/ruff-files.txt"
        else
          git diff --name-only HEAD~1 HEAD -- '*.py' > "${RUNNER_TEMP}/ruff-files.txt" || true
        fi
        if [ -s "${RUNNER_TEMP}/ruff-files.txt" ]; then
          mapfile -t files < "${RUNNER_TEMP}/ruff-files.txt"
          ruff check "${files[@]}"
        else
          echo "No changed Python files to lint."
        fi
    - name: Run Pytest
      run: PYTHONPATH=src pytest
    - name: Run Build
      run: python -m build
